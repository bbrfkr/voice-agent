# voice-agent — グローバル プッシュトゥトーク（Linux / sxhkd）
#
# 既定キー（F8）を「押している間だけ」録音する。ブラウザのタブが背面でも効く。
#
# 使い方:
#   1. sxhkd をインストール（例: sudo apt install sxhkd）
#   2. このファイルを ~/.config/sxhkd/sxhkdrc にコピー（または内容を追記）
#   3. sxhkd を起動: sxhkd &   （Wayland では動かない。X11 セッションで使うこと）
#   4. 設定を再読込: pkill -USR1 -x sxhkd
#
# URL（ポート）は SERVER_PORT に合わせて書き換える。
# sxhkd は detectable autorepeat なので、押しっぱなしでも release（@）は離した時に1回だけ。
# 押下中は start が複数回飛ぶことがあるが、ブラウザ側は recording 中なら無視するため安全。

# 押下 → 録音開始
F8
    curl -s -X POST "http://localhost:8000/api/remote-ptt?state=start"

# 離す → 録音停止
@F8
    curl -s -X POST "http://localhost:8000/api/remote-ptt?state=stop"

# ── ログモード切り替え = F9 ──
# 押すたびに ON/OFF が切り替わる（ON の間は STT 結果を Discord へ直送）。
# release（@）にバインドして、押しっぱなしのオートリピートで連打されないようにする。
@F9
    curl -s -X POST "http://localhost:8000/api/remote-logmode?state=toggle"
