# voice-agent — グローバル プッシュトゥトーク（Linux / sxhkd）
#
# 既定キー（F13）を「押している間だけ」録音する。ブラウザのタブが背面でも効く。
# ログモード／VAD はトグルではなく ON/OFF を別キーに割り当てて状態を確定させる
# （複数タブを開いていても確実に揃う）。
#
# 使い方:
#   1. sxhkd をインストール（例: sudo apt install sxhkd）
#   2. このファイルを ~/.config/sxhkd/sxhkdrc にコピー（または内容を追記）
#   3. sxhkd を起動: sxhkd &   （Wayland では動かない。X11 セッションで使うこと）
#   4. 設定を再読込: pkill -USR1 -x sxhkd
#
# URL（ポート）は SERVER_PORT に合わせて書き換える。
# sxhkd は detectable autorepeat なので、押しっぱなしでも release（@）は離した時に1回だけ。
# 押下中は start が複数回飛ぶことがあるが、ブラウザ側は recording 中なら無視するため安全。

# 押下 → 録音開始
F13
    curl -s -X POST "http://localhost:8000/api/remote-ptt?state=start"

# 離す → 録音停止
@F13
    curl -s -X POST "http://localhost:8000/api/remote-ptt?state=stop"

# ── ログモード ON = F14 / OFF = F15 ──
# ON の間は STT 結果を Discord へ直送。release（@）にバインドしてオートリピートの連打を防ぐ。
@F14
    curl -s -X POST "http://localhost:8000/api/remote-logmode?state=on"
@F15
    curl -s -X POST "http://localhost:8000/api/remote-logmode?state=off"

# ── 自動音声検出 (VAD) ON = F16 / OFF = F17 ──
# ON の間は声を検知して自動で録音開始・無音で停止。
@F16
    curl -s -X POST "http://localhost:8000/api/remote-vad?state=on"
@F17
    curl -s -X POST "http://localhost:8000/api/remote-vad?state=off"
