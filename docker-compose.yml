# voice-agent bot + STT(OpenAI互換) + VOICEVOX を docker compose でまとめて起動する。
#
# 構成:
#   - voice-agent : Discord bot 本体（軽量・GPU 不要）。ボイスチャンネルに常駐し発話に応答する。
#   - stt         : faster-whisper を OpenAI 互換 API で公開する STT サーバ（GPU）。
#   - voicevox    : TTS（GPU）。
#   STT/TTS は重い推論を担うため GPU が要る。bot 自体は GPU 不要なので、必要なら
#   stt / voicevox だけを GPU サーバに置き、bot を別ホストで動かして URL を向けてもよい
#   （その場合 .env の STT_BASE_URL / VOICEVOX_URL をリモートのアドレスにする）。
#
# 使い方:
#   cp .env.example .env   # DISCORD_BOT_TOKEN / DISCORD_VOICE_CHANNEL_ID 等を設定
#   docker compose up --build

services:
  # ── STT: faster-whisper を OpenAI 互換 API で公開（GPU） ──
  stt:
    image: ghcr.io/speaches-ai/speaches:latest-cuda   # OpenAI 互換 /v1/audio/transcriptions（例）
    restart: unless-stopped
    gpus: all
    volumes:
      - ./.cache/huggingface:/home/ubuntu/.cache/huggingface  # モデル DL キャッシュを永続化
    ports:
      - "8000:8000"   # ホストからの疎通確認用。不要なら消してよい

  # ── TTS: VOICEVOX engine（GPU/nvidia 版） ──
  voicevox:
    image: voicevox/voicevox_engine:nvidia-latest
    restart: unless-stopped
    gpus: all
    ports:
      - "50021:50021"   # ホストからの疎通確認用（/speakers 等）。不要なら消してよい

  # ── Discord bot 本体（軽量・GPU 不要） ──
  voice-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: voice-agent:latest
    restart: unless-stopped
    depends_on:
      - stt
      - voicevox
    # 設定値は .env から注入する（唯一の編集面。config.py は触らない）
    env_file:
      - .env
    # 同 compose 内のサービスを指す値はここで上書き（.env より優先）
    environment:
      STT_BASE_URL: http://stt:8000/v1
      VOICEVOX_URL: http://voicevox:50021
    stdin_open: true   # ログ表示と Ctrl+C のため
    tty: true
