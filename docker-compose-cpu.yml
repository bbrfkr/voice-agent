# voice-agent（Web サーバ）+ VOICEVOX engine（GPU版）を docker compose でまとめて起動する。
#
# 音声の入出力はブラウザ（getUserMedia / AudioContext）が担うため、PulseAudio のマウントや
# PULSE_SERVER は不要になった（旧構成からの大きな変更点）。ブラウザで
# http://localhost:8000 を開いて操作する。
#
# 前提（詳細は DOCKER.md）:
#   - GPU      : WSL2 backend + NVIDIA ドライバ（`gpus: all` が使える）
#   - マイク    : ブラウザの getUserMedia。secure context が必須なので、同一マシンなら
#                http://localhost:8000 を使う（LAN の別端末から使う場合は TLS が必要。README 参照）。
#   - config.py: env 駆動のローダ。秘密情報はイメージに焼かず .env から注入する。
#
# 使い方:  docker compose up --build  → ブラウザで http://localhost:8000

services:
  # ── TTS: VOICEVOX engine（GPU/nvidia 版） ──
  voicevox:
    image: voicevox/voicevox_engine:cpu-latest
    restart: unless-stopped
    ports:
      - "50021:50021"              # ホストからの疎通確認用（/speakers 等）。不要なら消してよい

  # ── 音声エージェント本体（FastAPI: STT→LLM→TTS のオーケストレーション + Web UI） ──
  voice-agent:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped        # WSL/Docker 再起動後も自動で復帰させる
    depends_on:
      - voicevox
    # 設定値は .env から注入する（唯一の編集面。config.py は触らない）
    env_file:
      - .env
    # Docker 固有の値だけはここで上書き（.env より優先）
    environment:
      VOICEVOX_URL: http://voicevox:50021   # 同 compose 内の TTS を参照
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8000
    extra_hosts:
      - "host.docker.internal:host-gateway"   # llama.cpp / opencode をホストで動かす場合の参照用
    ports:
      - "8000:8000"                # Web UI / API（ブラウザでここを開く）
    volumes:
      # faster-whisper(Whisper) の DL キャッシュを永続化（HF_HOME=/cache/hf）。
      # 初回だけ DL し、以降の起動は再利用する。ホスト側に root 所有で作られる点に注意。
      - ./.cache/huggingface:/cache/hf
