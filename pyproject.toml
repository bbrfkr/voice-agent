# voice-agent のツール設定・依存定義の一元管理。
#
# 実行依存も dev 依存も PEP 735 の [dependency-groups] に集約する（pip>=25.1 が必要）。
# パッケージ化はしないので [project] テーブルは置かない（フラットなスクリプト構成のまま）。
#
#   開発(macOS):  pip install --group dev      # 重い実行依存を巻き込まず ruff/mypy/pre-commit だけ
#   bot 実行:     pip install --group runtime  # STT/TTS はリモート HTTP なので bot 側に GPU は不要
#   Docker:       pip install --group runtime
#
# pip<25.1（--group 非対応）の場合のフォールバックは README / Makefile を参照。

[dependency-groups]
# ── 実行時のコア依存（プラットフォーム非依存・GPU 不要） ──
# STT(faster-whisper) と TTS(VOICEVOX) は GPU サーバ側の HTTP サービスに分離したため、
# bot 側にはモデルや CUDA を持たない。音声 I/O は Discord ボイスチャンネルで行う。
runtime = [
    "discord.py>=2.4",               # Discord bot 本体（voice 送信。pynacl で音声対応）
    "discord-ext-voice-recv>=0.5",   # ボイス受信拡張（AudioSink で話者ごとに PCM を受け取る）
    "PyNaCl>=1.5",                   # voice の暗号化（discord.py の voice に必須）
    "soundfile>=0.12.1",             # VOICEVOX が返す WAV のデコード
    "numpy>=1.24",                   # 音声フォーマット変換（リサンプル・ダウンミックス）
    "requests>=2.31",                # STT/LLM/VOICEVOX/Discord Webhook への HTTP
]
# ── 開発ツールのみ（runtime を include しない＝macOS で軽量に入る） ──
dev = [
    "ruff",
    "mypy",
    "pre-commit",
]

# ───────────────────────── ruff（lint + formatter） ─────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 120          # 長い日本語コメントの実態に合わせ、不要な折り返し差分を抑える
extend-exclude = ["train_local"]   # 学習スクリプト群は今回スコープ外
# pre-commit はファイルを明示的に渡すため、これが無いと除外が無視される（train_local も検査されてしまう）。
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

# ───────────────────────── mypy（型チェック・段階的strict） ─────────────────────────
[tool.mypy]
python_version = "3.12"
files = ["voice_agent.py", "config.py", "discord_agent.py"]   # 本体のみ。train_local は対象外
# 中程度strict のベースライン（まず green を作る。disallow_untyped_defs 等は次フェーズで ratchet）
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
strict_equality = true
check_untyped_defs = true

# 未インストール / 型情報のない外部ライブラリの import 解決失敗を無視する
# （macOS 開発環境には重い実行依存を入れないため）。自前コード側の整合性だけを検査する。
[[tool.mypy.overrides]]
module = [
    "discord",
    "discord.*",
    "soundfile",
    "numpy",
    "requests",
]
ignore_missing_imports = true
